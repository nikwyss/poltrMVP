# Wildcard / DNS-01 Certificate Setup
#
# Full documentation: see doc/TLS_CERTIFICATES.md
#
# Prerequisites:
# 1. Install Infomaniak webhook (Helm chart was discontinued — use the rendered
#    manifest published with each release):
#    kubectl apply -f https://github.com/Infomaniak/cert-manager-webhook-infomaniak/releases/download/v0.3.1/rendered-manifest.yaml
#
# 2. Create API token at: https://manager.infomaniak.com/v3/profile/api-tokens
#    Scope: "Domain" (read+write on DNS zones)
#
# 3. Create secret with the webhook's expected name — the RBAC Role shipped by
#    the webhook is scoped to exactly this name; renaming it will yield
#    "secret … not found" at runtime.
#    kubectl create secret generic infomaniak-api-credentials \
#      --namespace cert-manager \
#      --from-literal=api-token='YOUR_TOKEN'
#
# 4. Apply this file:
#    kubectl apply -f infra/cert/cert-manager-wildcard.yaml
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-dns
spec:
  acme:
    email: admin@poltr.info
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-dns-account-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.infomaniak.com
            solverName: infomaniak
            config:
              apiTokenSecretRef:
                name: infomaniak-api-credentials
                key: api-token
---
# NOTE: This file declares ClusterIssuers ONLY.
#
# Do NOT add `Certificate` resources here. Every TLS secret referenced in
# infra/kube/ingress.yaml is auto-created by the cert-manager ingress-shim from
# the `cert-manager.io/cluster-issuer` annotation. A second, hand-written
# Certificate pointing at the same `secretName` makes the two resources fight
# over the secret: each sees the other's output as a `SecretMismatch` and
# re-issues, forever.
#
# That happened here — `poltr-wildcard-cert` (poltr.info + *.poltr.info) and the
# shim's `poltr-wildcard-tls` (*.poltr.info) shared secret `poltr-wildcard-tls`,
# likewise `poltr-ch-cert` vs `poltr-ch-tls`. The poltr.ch pair looped every 8h
# until it hit the Let's Encrypt rate limit (5 certs per identifier set / 168h);
# the wildcard pair deadlocked and let the cert expire on 2026-08-05.
# Both hand-written Certificates were removed on 2026-08-11.
# See doc/TLS_CERTIFICATES.md.
---
# HTTP-01 ClusterIssuer for non-wildcard domains
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-http
spec:
  acme:
    email: admin@poltr.info
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-http-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
#
# The certificates themselves (*.poltr.info, poltr.ch/www.poltr.ch,
# *.id.poltr.ch) come from infra/kube/ingress.yaml — see the note above.
