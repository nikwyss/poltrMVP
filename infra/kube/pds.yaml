apiVersion: apps/v1
kind: Deployment
metadata:
  name: pds
  namespace: poltr
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: pds
  template:
    metadata:
      labels:
        app: pds
    spec:
      containers:
        - name: pds
          # Pinned by digest: upstream :latest drifted to a TS-based image
          # (Node 24, entrypoint /app/index.ts). Using a mutable tag let an
          # image-GC re-pull silently swap the layout and crash-loop the PDS.
          image: ghcr.io/bluesky-social/pds@sha256:1fa8bbceabb65d8e1710749b1ea92c1c20a7489ca38da4a0a5f64c0c10a70c29
          # cd /data is load-bearing: PDS_DATA_DIRECTORY is not set, so cwd
          # anchors the SQLite repo. Do NOT remove it (would risk a fresh repo
          # / new identity → relay federation break). Only the entrypoint file
          # changed: /app/index.js → /app/index.ts (matches image's own CMD).
          command: ["/bin/sh"]
          args: ["-c", "cd /data && exec node --enable-source-maps /app/index.ts"]
          envFrom:
            - secretRef:
                name: pds-secrets
          ports:
            - containerPort: 2583
          volumeMounts:
            - name: pds-data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /xrpc/_health
              port: 2583
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /xrpc/_health
              port: 2583
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: pds-data
          persistentVolumeClaim:
            claimName: pds-data
---
apiVersion: v1
kind: Service
metadata:
  name: pds
  namespace: poltr
spec:
  selector:
    app: pds
  ports:
    - port: 80
      targetPort: 2583
